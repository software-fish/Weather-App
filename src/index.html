<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="search-form">
        <span>Search city:</span>
        <input type="text" id="search-city">
        <button id="submit-city">Search</button>
    </div>
    <div id="primary-detail">
        <h2 id="condition"></h2>
        <h3 id="address"></h3>
    </div>
    <div id="temp">
        <h2 id="fahrenheit"></h2>
        <h3 id="max-temp"></h3>
        <h3 id="min-temp"></h3>
        <h3 id="humid"></h3>
    </div>
    <div id="next-hours">
        <div id="first-hour" class="hour">
            <h2>In 1 hour</h2>
            <h2 id="h-conditions"></h2>
            <h2 id="h-fahrenheit"></h2>
            <h3 id="h-humid"></h3>   
        </div>
        <div id="second-hour" class="hour">
            <h2>In 2 hours</h2>
            <h2 id="twoh-conditions"></h2>
            <h2 id="twoh-fahrenheit"></h2>
            <h3 id="twoh-humid"></h3>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
